<svg viewBox="0 0 420 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HVAC technician servicing an outdoor condenser unit">
  <defs>
    <linearGradient id="jumpsuit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="unitBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="366" rx="172" ry="14" fill="#000000" opacity="0.16"/>

  <!-- airflow wave lines from unit -->
  <g stroke="#BAE6FD" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M356 140 q18 -14 0 -28 q-16 -14 0 -28"/>
    <path d="M378 158 q18 -14 0 -28 q-16 -14 0 -28"/>
  </g>

  <!-- outdoor condenser unit -->
  <g>
    <rect x="248" y="182" width="150" height="164" rx="16" fill="url(#unitBody)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="238" y="168" width="170" height="20" rx="9" fill="#FFFFFF"/>
    <!-- fan grille -->
    <circle cx="323" cy="262" r="50" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    <circle cx="323" cy="262" r="37" fill="#0B1330" opacity="0.35"/>
    <line x1="328.8" y1="263.6" x2="356.8" y2="271.1" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="326.0" y1="267.2" x2="340.5" y2="292.3" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="321.4" y1="267.8" x2="313.9" y2="295.8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="317.8" y1="265.0" x2="292.7" y2="279.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="317.2" y1="260.4" x2="289.2" y2="252.9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="320.0" y1="256.8" x2="305.5" y2="231.7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="324.6" y1="256.2" x2="332.1" y2="228.2" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <line x1="328.2" y1="259.0" x2="353.3" y2="244.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <circle cx="323" cy="262" r="6" fill="#FFFFFF"/>
    <!-- vents -->
    <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.45">
      <line x1="264" y1="322" x2="382" y2="322"/>
      <line x1="264" y1="330" x2="382" y2="330"/>
      <line x1="264" y1="338" x2="382" y2="338"/>
    </g>
    <!-- control box -->
    <rect x="256" y="200" width="26" height="34" rx="5" fill="#EA580C"/>
    <circle cx="269" cy="212" r="5" fill="#FFF7ED"/>
    <line x1="262" y1="224" x2="276" y2="224" stroke="#FFF7ED" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- technician: standing, reaching toward control panel -->
  <g>
    <!-- legs -->
    <rect x="128" y="272" width="30" height="80" rx="14" fill="#38BDF8"/>
    <rect x="168" y="272" width="30" height="80" rx="14" fill="#0EA5E9"/>
    <!-- shoes -->
    <path d="M120 348 q0 -8 10 -8 l24 0 q10 0 12 8 l2 8 q0 6 -8 6 l-40 0 q-6 0 -6 -6 Z" fill="#0F172A"/>
    <path d="M162 348 q0 -8 10 -8 l24 0 q10 0 12 8 l2 8 q0 6 -8 6 l-40 0 q-6 0 -6 -6 Z" fill="#0F172A"/>

    <!-- torso -->
    <path d="M118 176 q-16 8 -18 40 l-2 60 q0 14 14 16 l88 0 q14 -2 14 -16 l-2 -60 q-2 -32 -18 -40 q-18 -10 -38 -10 q-20 0 -38 10 Z" fill="url(#jumpsuit)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- chest stripe -->
    <path d="M122 214 q40 18 76 0 l0 16 q-38 16 -76 0 Z" fill="#EA580C" opacity="0.92"/>

    <!-- tool belt -->
    <rect x="112" y="262" width="96" height="15" rx="7" fill="#0F172A" opacity="0.85"/>
    <rect x="148" y="259" width="22" height="20" rx="4" fill="#EA580C"/>

    <!-- back arm relaxed at side -->
    <path d="M120 190 q-16 6 -18 34 q-1 16 8 24 l12 -8 q-6 -8 -5 -20 q1 -16 12 -22 Z" fill="#E0F2FE" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="112" cy="248" r="9" fill="#FDE9DD"/>

    <!-- front arm reaching to unit control panel -->
    <path d="M196 196 q28 -10 46 4 q9 7 8 18 l-12 8 q-2 -10 -12 -15 q-14 -8 -30 -3 Z" fill="#F0F9FF" stroke="#FFFFFF" stroke-width="2"/>
    <!-- hand -->
    <circle cx="252" cy="216" r="9" fill="#FDE9DD"/>
    <!-- wrench -->
    <g transform="translate(250,214) rotate(-24)">
      <rect x="0" y="-3.5" width="30" height="7" rx="3.5" fill="#F8FAFC"/>
      <path d="M-2 -9 a10 10 0 1 0 0.2 18 a7 7 0 1 1 -0.2 -18 Z" fill="#F8FAFC"/>
      <rect x="26" y="-6" width="9" height="12" rx="2.5" fill="#F8FAFC"/>
    </g>

    <!-- neck -->
    <rect x="140" y="152" width="18" height="18" rx="6" fill="#FDE9DD"/>
    <!-- head -->
    <circle cx="149" cy="132" r="26" fill="#FDE9DD"/>
    <!-- hair -->
    <path d="M124 124 q4 -26 26 -26 q24 0 26 22 q-10 -8 -26 -8 q-16 0 -26 12 Z" fill="#0F172A"/>
    <!-- safety helmet -->
    <path d="M119 118 a30 30 0 0 1 60 0 l0 4 l-60 0 Z" fill="#EA580C"/>
    <rect x="112" y="120" width="74" height="10" rx="5" fill="#FB923C"/>
    <!-- face hint -->
    <circle cx="141" cy="134" r="2.4" fill="#0F172A" opacity="0.75"/>
    <circle cx="157" cy="134" r="2.4" fill="#0F172A" opacity="0.75"/>
    <path d="M141 145 q8 6 16 0" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- floating check accent -->
  <g>
    <circle cx="60" cy="150" r="18" fill="#FFFFFF" opacity="0.08"/>
    <path d="M51 150 l7 7 13 -15" stroke="#4ADE80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
